name: Index backtest

on:
  push:
    branches: [claude/index-selection-investment-nzcgqd]
    paths: ["investment-backtest/**", ".github/workflows/backtest.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r investment-backtest/requirements.txt
      - name: Run backtests
        working-directory: investment-backtest
        run: |
          rm -rf results && mkdir -p results
          python backtest.py --out results/long --save-data results/data_long 2>&1 | tee results/long.txt
          python backtest.py --mode etf --out results/etf --save-data results/data_etf 2>&1 | tee results/etf.txt
          python scenarios.py --data-dir results/data_long --out results/scenarios.csv 2>&1 | tee results/scenarios.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f investment-backtest/results
          git commit -m "Update backtest results" || echo "no changes"
          git push
